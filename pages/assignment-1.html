<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment #1 - Conversion</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <a class="home" href="../index.html" aria-label="Home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
    <span class="name">Romar Izzy P. Flestado &nbsp; &nbsp; &nbsp; BSCS-1B</span>
  </header>

  <main class="page">

    <h1 class="page-title">Assignment #1 - Conversion</h1>
    <p class="page-text">Converts temperature and length values between units.</p>

    <div class="boxes">

      <div class="box" data-type="c-to-f">
        <label class="box-label" for="c-to-f">Celsius to Fahrenheit</label>
        <input id="c-to-f" type="number" placeholder="0">
        <span class="result">—</span>
      </div>

      <div class="box" data-type="f-to-c">
        <label class="box-label" for="f-to-c">Fahrenheit to Celsius</label>
        <input id="f-to-c" type="number" placeholder="0">
        <span class="result">—</span>
      </div>

      <div class="box" data-type="m-to-ft">
        <label class="box-label" for="m-to-ft">Meters to Feet</label>
        <input id="m-to-ft" type="number" placeholder="0">
        <span class="result">—</span>
      </div>

      <div class="box" data-type="ft-to-m">
        <label class="box-label" for="ft-to-m">Feet to Meters</label>
        <input id="ft-to-m" type="number" placeholder="0">
        <span class="result">—</span>
      </div>

    </div>

  </main>

  <script src="../js/assignment-1.js"></script>
</body>
</html>
